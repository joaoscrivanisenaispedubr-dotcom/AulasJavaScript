<body>
    
    <h1>desafio 2 </h1>
    <h2 id="resultado"></h2>
   
   <script>
        let Numero1 = parseFloat (window.prompt ("Digite o seu numero da sorte "))
        let Numero2 = parseFloat (window.prompt ("Digite o seu segundo numero da sorte "))
        let operacao = window.prompt (" qual e a Ecuaçao + ou -")
        let resultado = 0
        if(operacao == "+") {
            resultado = Numero1 + Numero2
        }else {
            resultado = Numero1 - Numero2
        }


        document.getElementById("resultado").innerText = "o resultado da soma: "  + resultado


   </script>
